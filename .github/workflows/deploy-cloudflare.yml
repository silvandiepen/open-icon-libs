name: Deploy Cloudflare

on:
  push:
    branches:
      - development
  workflow_run:
    workflows:
      - Publish Packages
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 25

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/heads/${{ env.DEPLOY_BRANCH }}

      - name: Configure deployment target
        id: target
        run: |
          case "${DEPLOY_BRANCH}" in
            development)
              echo "api_base_url=https://api.dev.open-icon.org" >> "$GITHUB_OUTPUT"
              echo "pages_project=open-icon-org-dev" >> "$GITHUB_OUTPUT"
              ;;
            master)
              echo "api_base_url=https://api.open-icon.org" >> "$GITHUB_OUTPUT"
              echo "pages_project=open-icon-org" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported deploy branch: ${DEPLOY_BRANCH}" >&2
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify open-icon API
        run: npm --workspace open-icon-api run test

      - name: Verify open-icon docs
        env:
          OPEN_ICON_API_BASE_URL: ${{ steps.target.outputs.api_base_url }}
        run: |
          npm --workspace open-icon-org run typecheck
          npm --workspace open-icon-org run build

      - name: Deploy api.dev.open-icon.org Worker
        if: env.DEPLOY_BRANCH == 'development'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: apps/open-icon-api
          command: deploy --env development

      - name: Deploy api.open-icon.org Worker
        if: env.DEPLOY_BRANCH != 'development'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: apps/open-icon-api
          command: deploy

      - name: Deploy open-icon.org Pages site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy apps/open-icon-org/public --project-name=${{ steps.target.outputs.pages_project }} --branch=${{ env.DEPLOY_BRANCH }}
